paths:
  raw_data:       data/raw/mockup_awards.csv
  processed_data: data/processed/awards_cleaned.csv
  taxonomy_dir:   output/reports/taxonomy
  charts_dir:     output/charts
  logs_dir:       logs

llm:
  provider: gemini
  model: gemini-2.0-flash
  temperature: 0.1
  max_output_tokens: 8192
  timeout_seconds: 60
  # Keys are read from .env (GEMINI_API_KEY) -- never commit real keys here
  api_keys: []
  pricing:
    input_per_million: 0.10
    output_per_million: 0.40

taxonomy:
  batch_size: 50
  compress_every_n_batches: 5
  start_batch: 10
  min_category_frequency: 10
  output_file: output/reports/taxonomy/compressed_taxonomy_with_ids.json

annotation:
  batch_size: 20
  max_workers: 2
  temperature: 0.1
  output_file: output/reports/annotated_results.csv
  cleaned_output_file: output/reports/annotated_results_cleaned.csv

visualization:
  donut_chart_width: 12
  donut_chart_height: 8
  treemap_width: 16
  treemap_height: 10
  exclude_award_reasons: []
  exclude_product_values: []

data:
  date_column: award_date
  message_column: message
  dedup_column: message